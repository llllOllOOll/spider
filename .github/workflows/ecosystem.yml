# Runs the official modules (llllOllOOll/spider-modules) against this
# commit: the release gate of RFC 0001 (docs/rfcs/0001-modules.md). Called
# by ci.yml on every push and pull request to develop and main, and so by
# release.yml on every tag (a release does not ship while an official
# module fails); also by hand. spider-modules runs the same check nightly
# against Spider main.
name: Ecosystem

on:
  workflow_dispatch:
  workflow_call:

jobs:
  modules:
    uses: llllOllOOll/spider-modules/.github/workflows/ecosystem.yml@main
    with:
      spider_ref: ${{ github.sha }}
