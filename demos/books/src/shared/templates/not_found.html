extends "layout"

<!-- Rendered by spider.errorHandler(.{ .not_found_view = "not_found" }) for a
     full-page 404, with .message and .path. -->
<h1 class="text-2xl font-semibold">Not found</h1>
<p class="mt-2 text-stone-600">{ message }</p>
<p class="mt-1 text-sm text-stone-400 font-mono">{ path }</p>
<a href="/" class="inline-block mt-6 text-sm text-stone-500 hover:underline">← Back to the shelf</a>
